# ─────────────────────────────────────────────────────────────
#  nginx.conf — main configuration for the CMS reverse proxy.
#
#  Per sub-spec 09: nginx terminates TLS on cms.local:443 and routes
#  traffic to the frontend (host), backend (host), Keycloak, n8n and
#  oauth2-proxy (docker), all under one origin so the iframe session
#  cookie flows without SameSite=None gymnastics.
#
#  Brotli is intentionally not enabled — the official nginx:1.25
#  image doesn't ship the module. Production deployments should use
#  a custom image (e.g. `fholzer/nginx-brotli`) or terminate TLS at
#  a CDN that brotli-encodes upstream.
# ─────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;
worker_rlimit_nofile  8192;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── Logging ──────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time '
                      'uct="$upstream_connect_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    # ─── Tuning ───────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;     # don't leak nginx version in headers/errors

    # ─── Buffer sizes (Keycloak login pages set big cookies) ──
    client_body_buffer_size      16k;
    client_max_body_size         50m;     # uploads to CMS via /api/*
    client_header_buffer_size    2k;
    large_client_header_buffers  4 16k;   # 16k accommodates Keycloak's JSESSION + KC_AUTH cookies

    # ─── WebSocket upgrade map ────────────────────────────────
    # Standard pattern: when the client sends Upgrade: websocket, this
    # variable yields "upgrade"; otherwise it yields "close" so nginx
    # doesn't hold idle upstreams open.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ─── Compression ──────────────────────────────────────────
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_min_length    1024;
    gzip_comp_level    6;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/x-font-ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ─── TLS defaults (server block can override) ─────────────
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache       shared:SSL:10m;
    ssl_session_timeout     1h;
    ssl_session_tickets     off;

    # ─── Real IP — we ARE the edge, so don't trust upstream XFF ─
    # The application stack receives the IP we set via proxy_set_header
    # X-Real-IP $remote_addr; anything coming from a client claiming
    # to already be proxied is ignored.
    real_ip_header X-Real-IP;
    # NB: we deliberately do NOT set real_ip_recursive / set_real_ip_from
    # — nginx will use the actual TCP peer ($remote_addr) as the real IP.

    include /etc/nginx/conf.d/*.conf;
}
