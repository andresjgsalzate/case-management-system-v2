# ─────────────────────────────────────────────────────────────
#  cms.conf — virtual host for cms.local (dev).
#
#  Routing table (sub-spec 09 §3.1):
#    /              → frontend  (Next.js on the host)
#    /api/*         → backend   (FastAPI  on the host)
#    /auth/*        → keycloak:8080
#    /n8n/*         → oauth2-proxy:4180   (proxy → n8n:5678)
#    /webhook/*     → n8n:5678            (bypasses oauth2-proxy; HMAC at app layer)
#
#  Frontend + backend deliberately stay on the host (started by dev.sh
#  / dev.bat) — nginx reaches them via host.docker.internal. On Linux
#  the nginx service in docker-compose declares
#    extra_hosts: ["host.docker.internal:host-gateway"]
#  so the name resolves there too.
# ─────────────────────────────────────────────────────────────

# ─── HTTP → HTTPS redirect ────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name cms.local;

    # ACME challenge could go here in prod; for dev we just redirect.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Resolver for lazy DNS lookup ────────────────────────────
# Docker's embedded DNS lives at 127.0.0.11. By using a variable
# inside `proxy_pass` further down, nginx defers the lookup to
# request time -- otherwise nginx would refuse to boot when any
# upstream container hasn't been started yet (chicken-and-egg
# between nginx and oauth2-proxy, which itself needs nginx up
# to complete OIDC discovery on first start).
resolver 127.0.0.11 valid=10s ipv6=off;

# Host upstreams stay as `upstream` blocks -- they resolve via
# the host gateway and the host gateway is always available.
upstream cms_frontend {
    server host.docker.internal:3000;
    keepalive 32;
}

upstream cms_backend {
    server host.docker.internal:8000;
    keepalive 32;
}

# ─── Main TLS server ──────────────────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name cms.local;

    ssl_certificate     /etc/nginx/certs/cms.local.crt;
    ssl_certificate_key /etc/nginx/certs/cms.local.key;

    # ─── Security headers (apply to every response) ──────────
    # HSTS: short max-age for dev (cert rotation flips fingerprints often);
    # production should use ≥ 6 months and the `preload` flag once stable.
    add_header  Strict-Transport-Security "max-age=300; includeSubDomains" always;
    add_header  X-Content-Type-Options    "nosniff" always;
    add_header  Referrer-Policy           "strict-origin-when-cross-origin" always;
    # frame-ancestors 'self' allows the /n8n/ iframe to be embedded by the
    # CMS shell (same origin), and blocks any cross-site embedding.
    # CSP intentionally narrow — frontend can extend per-route if needed.
    add_header  Content-Security-Policy   "frame-ancestors 'self'" always;

    # ─── Shared proxy directives (applied per location) ──────
    # Common pattern: forward host + scheme so n8n / Keycloak generate
    # absolute URLs that point back at cms.local:443, not the upstream
    # service name. Real IP is set from the actual TCP peer.
    proxy_http_version  1.1;
    proxy_set_header    Host                $host;
    proxy_set_header    X-Real-IP           $remote_addr;
    proxy_set_header    X-Forwarded-For     $remote_addr;
    proxy_set_header    X-Forwarded-Host    $host;
    proxy_set_header    X-Forwarded-Proto   https;
    proxy_set_header    X-Forwarded-Port    443;

    # WebSocket upgrade — frontend HMR + n8n editor live updates need this.
    proxy_set_header    Upgrade             $http_upgrade;
    proxy_set_header    Connection          $connection_upgrade;

    # Timeouts. n8n executions can be slow; keep `proxy_read_timeout`
    # generous in the n8n/webhook blocks specifically (overridden below).
    proxy_connect_timeout   30s;
    proxy_send_timeout      60s;
    proxy_read_timeout      60s;

    # ─── /api → backend ───────────────────────────────────────
    location /api/ {
        proxy_pass http://cms_backend;
    }

    # FastAPI Swagger lives at /docs — keep accessible for dev convenience.
    location = /docs {
        proxy_pass http://cms_backend/docs;
    }
    location = /openapi.json {
        proxy_pass http://cms_backend/openapi.json;
    }

    # ─── /auth → Keycloak ─────────────────────────────────────
    # `set` + variable upstream forces lazy DNS resolution so nginx
    # boots even before the keycloak container exists.
    location /auth/ {
        set $kc_upstream http://keycloak:8080;
        proxy_pass $kc_upstream;
    }

    # ─── n8n Public REST API (X-N8N-API-KEY auth) ────────────
    # The backend reaches n8n's REST API through this path. oauth2-proxy
    # is bypassed because the API key on the request authenticates the
    # caller without an interactive session. n8n exposes the API at
    # `/api/v1/...` regardless of N8N_PATH (same root-mount quirk as
    # the static assets), so we strip the `/n8n-api/` prefix on the way
    # through.
    #
    # In production with backend inside the docker network this route
    # is unused -- backend uses `http://n8n:5678/api/v1/...` directly.
    location /n8n-api/ {
        set $n8n_api http://n8n:5678;
        rewrite ^/n8n-api/(.*)$ /api/$1 break;
        proxy_pass $n8n_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ─── Next.js page that wraps the n8n iframe with CMS chrome ──
    # Exact match (`=`) catches `/n8n` (no trailing slash) and forwards
    # to the frontend BEFORE nginx auto-redirects `/n8n` -> `/n8n/`
    # (which would hit oauth2-proxy and serve the raw editor with no
    # toolbar). The Next.js page itself renders the iframe pointing at
    # `/n8n/` which still goes through oauth2-proxy.
    location = /n8n {
        proxy_pass http://cms_frontend;
    }

    # ─── n8n's absolute-path sentry.js (no /n8n/ prefix) ─────
    # n8n 1.65's editor HTML hardcodes `<script src="/rest/sentry.js">`
    # without the N8N_PATH prefix. With diagnostics disabled n8n
    # returns 404 anyway -- but routing this to the frontend (which
    # is the default for `/`) returns the SPA's 404 *page* (HTML),
    # producing a "MIME type text/html not executable" console error
    # on every editor load. Forwarding straight to n8n keeps the 404
    # but loses the HTML body and the MIME warning.
    location = /rest/sentry.js {
        set $n8n_sentry http://n8n:5678;
        proxy_pass $n8n_sentry;
        proxy_set_header Host $host;
    }

    # ─── n8n static assets (bypass oauth2-proxy) ─────────────
    # n8n with N8N_PATH=/n8n/ generates HTML that references
    # `/n8n/assets/...`, but its server actually serves those files
    # at `/assets/...` (no prefix). Strip the prefix here and skip
    # the oauth2-proxy gate — static bundles don't expose user data
    # and going through the auth proxy with prefix mismatch returns
    # n8n's SPA fallback (text/html) instead of the JS/CSS bytes.
    # `/rest/*` follows the same pattern (n8n REST routes live at
    # root); the editor's `window.REST_ENDPOINT = 'rest'` resolves
    # relative to /n8n/ so the browser still asks for /n8n/rest/...
    location ~ ^/n8n/(assets|static|favicon\.ico|fonts|locales|types|workflow-templates|rest)/(.*)$ {
        set $n8n_static http://n8n:5678;
        rewrite ^/n8n/(.*)$ /$1 break;
        proxy_pass $n8n_static;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    # ─── /n8n → oauth2-proxy → n8n ───────────────────────────
    # oauth2-proxy handles authentication, then forwards to n8n with
    # X-Forwarded-User. n8n on Free is single-admin, so the user header
    # is informational only — sub-spec 09 §3.3.
    location /n8n/ {
        set $oauth2_proxy http://oauth2-proxy:4180;
        proxy_pass $oauth2_proxy;

        # n8n editor streams execution updates via WebSocket.
        proxy_read_timeout  3600s;   # long-lived WS
        proxy_send_timeout  3600s;
    }

    # oauth2-proxy callback path — must match the realm client redirect URI.
    location = /n8n/oauth2/callback {
        set $oauth2_proxy http://oauth2-proxy:4180;
        proxy_pass $oauth2_proxy;
    }

    # ─── /webhook → n8n direct (no auth) ─────────────────────
    # External services (Wazuh alerts, scheduled hooks) post here.
    # n8n verifies HMAC at the workflow level — we bypass oauth2-proxy
    # because no human session exists for these calls.
    location /webhook/ {
        set $n8n_upstream http://n8n:5678;
        proxy_pass $n8n_upstream;

        proxy_read_timeout  300s;
        client_max_body_size 50m;   # alert payloads
    }

    # ─── / → frontend (Next.js dev on host) ──────────────────
    location / {
        proxy_pass http://cms_frontend;

        # Next.js HMR uses a WebSocket on the same port; Upgrade headers
        # inherited from the server block already handle it.
    }
}
