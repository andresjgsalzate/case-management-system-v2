# ─────────────────────────────────────────────────────────────
#  oauth2-proxy.cfg — sub-spec 09 §3.3
#
#  Sits in front of n8n. Validates Keycloak sessions and forwards
#  X-Forwarded-User to n8n (informational on Free; auth on Enterprise).
#
#  Secrets come from the environment, not this file:
#    OAUTH2_PROXY_CLIENT_SECRET  — matches the `oauth2-proxy` client in
#                                   keycloak/realm-export.json
#    OAUTH2_PROXY_COOKIE_SECRET  — 16/24/32 raw bytes (or base64); signs
#                                   the session cookie
#
#  File format: oauth2-proxy uses an INI-ish format
#    https://oauth2-proxy.github.io/oauth2-proxy/configuration/overview
# ─────────────────────────────────────────────────────────────

http_address = "0.0.0.0:4180"
reverse_proxy = true

# ─── Upstream (the thing we're protecting) ───────────────────
upstreams = ["http://n8n:5678"]
pass_host_header = true

# ─── Identity provider ───────────────────────────────────────
provider              = "keycloak-oidc"
provider_display_name = "CMS Keycloak"
client_id             = "oauth2-proxy"
oidc_issuer_url       = "https://cms.local/auth/realms/cms"
# Only `openid` -- profile/email aren't defined as separate client
# scopes in our realm import (Keycloak only auto-creates them on UI
# realm creation, not via realm-export.json). The cms-frontend
# client carries inline protocolMappers that emit email + roles
# regardless of requested scopes.
scope                 = "openid"

# Dev: trust the self-signed nginx cert so the back-channel call to
# Keycloak works. Production drops this flag and mounts a real CA bundle.
ssl_insecure_skip_verify = true

# ─── Routing ─────────────────────────────────────────────────
# nginx routes /n8n/* to us, so our own oauth2 endpoints sit under
# /n8n/oauth2/* — the callback URL configured in the realm matches.
proxy_prefix = "/n8n/oauth2"
redirect_url = "https://cms.local/n8n/oauth2/callback"

# ─── Access policy ───────────────────────────────────────────
# Spec §3.3 says any authenticated identity passes; CMS-side
# permissions gate the actual /n8n route in the frontend.
email_domains      = ["*"]
whitelist_domains  = ["cms.local"]
skip_provider_button = true   # auto-redirect to Keycloak

# ─── Cookie (browser session) ────────────────────────────────
cookie_name     = "_cms_n8n_proxy"
cookie_domains  = ["cms.local"]
cookie_secure   = true
cookie_samesite = "lax"
cookie_httponly = true
cookie_expire   = "8h"
cookie_refresh  = "4h"

# ─── Headers to upstream (n8n) ───────────────────────────────
pass_user_headers     = true
pass_access_token     = false
set_authorization_header = false
set_xauthrequest      = true
