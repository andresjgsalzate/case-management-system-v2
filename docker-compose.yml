version: "3.9"

# ──────────────────────────────────────────────────────────────────────────────
# Case Management System — local dev stack
#
# Always-on services (no profile): postgres, redis, n8n
# Opt-in profiles (heavier or specialized):
#   --profile wazuh         → wazuh-manager + wazuh-indexer + wazuh-dashboard
#                             (~5-6 GB RAM, needs SSL certs — see WARNING below)
#   --profile velociraptor  → velociraptor server (needs api.config.yaml — see WARNING)
#   --profile soc-full      → enables both wazuh + velociraptor profiles
#
# Examples:
#   docker-compose up -d                              # postgres + redis + n8n
#   docker-compose --profile wazuh up -d              # + Wazuh stack
#   docker-compose --profile soc-full up -d           # everything
# ──────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:15-alpine
    container_name: cms_postgres
    environment:
      POSTGRES_DB: cms_dev
      POSTGRES_USER: cms_user
      POSTGRES_PASSWORD: cms_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms_user -d cms_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cms_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Keycloak: IdP for CMS + n8n SSO (Sub-spec 09) ────────────────────────
  # Single source of OIDC identity. Realm `cms` is auto-imported from
  # ./keycloak/realm-export.json on first boot (only with an empty volume —
  # see docs/INFRA.md for re-import procedure).
  #
  # Admin console: https://cms.local/auth/admin  (user from .env)
  # OIDC discovery: https://cms.local/auth/realms/cms/.well-known/openid-configuration
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: cms_keycloak
    restart: unless-stopped
    # Internal HTTP only — TLS terminated by nginx upstream. The port is
    # exposed to the host so the backend (running on host via dev.sh) can
    # fetch JWKS at http://localhost:8080/auth/realms/cms/protocol/openid-connect/certs.
    # In prod the backend lives on the same docker network and uses
    # http://keycloak:8080/... — this mapping becomes redundant.
    ports:
      - "8080:8080"
    environment:
      # Bootstrap admin — used to log into the master realm.
      KEYCLOAK_ADMIN: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD must be set in .env}
      # Reverse-proxy awareness — TLS is terminated by nginx; Keycloak
      # serves plain HTTP internally and trusts the X-Forwarded-* set by nginx.
      KC_PROXY: edge
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: cms.local
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_RELATIVE_PATH: /auth
      # Default H2 storage for dev. Production should switch to KC_DB=postgres
      # and point KC_DB_URL at a managed Postgres instance.
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    command:
      - start-dev
      - --import-realm
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      # KC 24 exposes /health/ready when KC_HEALTH_ENABLED=true.
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ─── oauth2-proxy in front of n8n (Sub-spec 09) ───────────────────────────
  # Validates Keycloak sessions and forwards X-Forwarded-User to n8n.
  # Required because n8n Community can't do OIDC natively — Enterprise
  # later enables OIDC directly and oauth2-proxy can be removed.
  #
  # extra_hosts maps cms.local → host so the back-channel call to
  # Keycloak (over the nginx-terminated TLS at cms.local) resolves.
  # Without this the OIDC discovery probe fails (DNS error).
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: cms_oauth2_proxy
    restart: unless-stopped
    command:
      - --config=/etc/oauth2-proxy/oauth2-proxy.cfg
    environment:
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:?OAUTH2_PROXY_CLIENT_SECRET must be set in .env}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?OAUTH2_PROXY_COOKIE_SECRET must be set in .env}
    volumes:
      - ./oauth2-proxy/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
    extra_hosts:
      - "cms.local:host-gateway"
    depends_on:
      keycloak:
        condition: service_healthy
      n8n:
        condition: service_started

  # ─── nginx reverse proxy (Sub-spec 09) ────────────────────────────────────
  # Single entry point for the dev stack. Routes by path under one origin
  # (cms.local) so the n8n iframe can share the browser session cookie:
  #   /              → host.docker.internal:3000  (frontend, run by dev.sh)
  #   /api/*         → host.docker.internal:8000  (backend,  run by dev.sh)
  #   /auth/*        → keycloak:8080
  #   /n8n/*         → oauth2-proxy:4180 → n8n:5678
  #   /webhook/*     → n8n:5678 (no auth; HMAC at app layer)
  #
  # TLS: self-signed cert in nginx/certs (regenerate with dev/generate-dev-certs.sh).
  # Hosts: cms.local must resolve to 127.0.0.1 (dev/hosts-setup.sh).
  nginx:
    image: nginx:1.25
    container_name: cms_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    # `host-gateway` makes host.docker.internal resolve on Linux too.
    # Docker Desktop (Win/macOS) already provides this name automatically;
    # the line is a no-op there.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # nginx alone — no curl in the base image; use the built-in stub.
      test: ["CMD", "service", "nginx", "status"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Backend API (FastAPI) — opt-in via profile 'backend' ────────────────
  # Hosts the Python app + WeasyPrint native libs (cairo, pango, gdk-pixbuf,
  # gobject) that PDF generation needs but are painful to install on Windows.
  # Local Windows dev can keep using `dev.sh` (no PDF) or switch to this
  # container when working on alert_reports.
  #
  # Usage:
  #   docker-compose --profile backend up -d backend
  #
  # API: http://localhost:8000
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cms_backend
    profiles: ["backend", "full"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # The host postgres listens on 5433; from inside the docker network the
      # service hostname is `postgres` and the in-network port is 5432.
      DATABASE_URL: "postgresql+asyncpg://cms_user:cms_password@postgres:5432/cms_dev"
      # `REAL_DATABASE_URL` survives conftest's autouse `set_test_env` fixture
      # (which patches DATABASE_URL to a dummy `localhost/db`). Integration
      # tests that need to actually hit Postgres read from this var.
      REAL_DATABASE_URL: "postgresql+asyncpg://cms_user:cms_password@postgres:5432/cms_dev"
      REDIS_URL: "redis://redis:6379/0"
      SECRET_KEY: "dev-secret-key-32-chars-minimum-please-change-in-prod"
      # pydantic-settings parses List[str] env vars as JSON first; the
      # field validator only sees plain strings. Use JSON array literal.
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
    volumes:
      # Live-reload source from host. .venv-windows is excluded so the
      # container uses its own site-packages (Linux wheels).
      - ./backend:/app/backend
      - ./alembic.ini:/app/alembic.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      uvicorn backend.src.main:app
      --host 0.0.0.0 --port 8000 --reload
      --reload-dir /app/backend

  # ─── n8n: workflow orchestrator (Sub-spec 05 + 09) ────────────────────────
  # ~200 MB RAM. Reachable ONLY through nginx at https://cms.local/n8n/
  # (auth via oauth2-proxy) or /webhook/ (no auth, HMAC at app layer).
  # The direct host port 5678 was removed when sub-spec 09 introduced
  # the reverse proxy — exposing it would bypass oauth2-proxy and break
  # the single-admin compensating control while on n8n Free.
  #
  # SQLite for dev simplicity; switch to postgres env vars below for prod-like setup.
  n8n:
    image: n8nio/n8n:1.65.0
    container_name: cms_n8n
    restart: unless-stopped
    environment:
      # Auth is handled by oauth2-proxy upstream — n8n basic-auth removed.
      - N8N_HOST=cms.local
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_PATH=/n8n/
      - WEBHOOK_URL=https://cms.local/webhook/
      - N8N_PROXY_HOPS=1               # nginx is the one trusted hop
      - N8N_USER_MANAGEMENT_DISABLED=true  # Free plan: single-admin mode
      - N8N_DIAGNOSTICS_ENABLED=false
      - GENERIC_TIMEZONE=America/Bogota
      - DB_TYPE=sqlite
      # For postgres-backed n8n (prod-like), uncomment:
      # - DB_TYPE=postgresdb
      # - DB_POSTGRESDB_HOST=postgres
      # - DB_POSTGRESDB_PORT=5432
      # - DB_POSTGRESDB_DATABASE=n8n
      # - DB_POSTGRESDB_USER=cms_user
      # - DB_POSTGRESDB_PASSWORD=cms_password
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Wazuh stack (Sub-spec 04) — profile 'wazuh' ──────────────────────────
  # WARNING: this is a minimal dev setup. Production deployments should follow
  # the official wazuh-docker repo (https://github.com/wazuh/wazuh-docker) which
  # includes a cert-generation script for inter-service mTLS. Here we run with
  # demo SSL plugins disabled to make it boot without manual cert wrangling.
  #
  # API: https://localhost:55000  (user: wazuh-wui  / pass: MyS3cr37P450r.*-)
  # Dashboard: http://localhost:5601
  # Agent enrollment port: 1515  |  Agent log collection: 1514/udp
  wazuh-manager:
    image: wazuh/wazuh-manager:4.7.5
    container_name: cms_wazuh_manager
    profiles: ["wazuh", "soc-full"]
    hostname: wazuh.manager
    restart: unless-stopped
    ports:
      - "1514:1514/udp"
      - "1515:1515"
      - "55000:55000"
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
    depends_on:
      - wazuh-indexer
    ulimits:
      memlock: { soft: -1, hard: -1 }

  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.7.5
    container_name: cms_wazuh_indexer
    profiles: ["wazuh", "soc-full"]
    hostname: wazuh.indexer
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - wazuh_indexer_data:/var/lib/wazuh-indexer

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.7.5
    container_name: cms_wazuh_dashboard
    profiles: ["wazuh", "soc-full"]
    hostname: wazuh.dashboard
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=https://wazuh-indexer:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      - wazuh-indexer

  # ─── Velociraptor (Sub-spec 07) — profile 'velociraptor' ──────────────────
  # WARNING: requires server.config.yaml + api.config.yaml generated BEFORE
  # first boot. Generate with:
  #   mkdir -p velo-config
  #   docker run --rm -it -v "$PWD/velo-config:/configs" \
  #     wlambert/velociraptor:0.74 \
  #     velociraptor --config /configs/server.config.yaml config generate -i
  # Then add the generated client + api configs to velo-config/ before bringing
  # the service up.
  #
  # GUI: https://localhost:8889
  # API (gRPC mTLS): localhost:8001  — configure CMS via VELOCIRAPTOR_ENDPOINT
  # Agent frontend: 8000
  velociraptor:
    image: wlambert/velociraptor:0.74
    container_name: cms_velociraptor
    profiles: ["velociraptor", "soc-full"]
    restart: unless-stopped
    ports:
      - "8889:8889"
      - "8001:8001"
      - "8000:8000"
    volumes:
      - velociraptor_data:/velociraptor
      - ./velo-config:/configs:ro

volumes:
  postgres_data:
  n8n_data:
  keycloak_data:
  # Wazuh persistent volumes (only mounted when profile 'wazuh' active)
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh_indexer_data:
  # Velociraptor
  velociraptor_data:
